# 💰 Update Currencies Price API
name: 💰 Update Currencies Price API

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages     
  cancel-in-progress: true     

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json found — skipping npm install."
            exit 0
          fi
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Scrape currencies price
        run: |
          echo "Scraping Alanchand currencies price..."
          node scripts/scrape-currencies-price.js

      - name: Validate currencies.json
        run: |
          set -euo pipefail
          if [ ! -f public/currencies.json ]; then
            echo "ERROR: currencies.json was not created."
            exit 1
          fi
          jq empty public/currencies.json
          CURRENCY_TYPE=$(jq -r '.currencies | type' public/currencies.json)
          if [ "$CURRENCY_TYPE" != "array" ]; then
            echo "ERROR: currencies is not an array."
            exit 1
          fi
          CURRENCY_COUNT=$(jq '.currencies | length' public/currencies.json)
          echo "Currencies found: $CURRENCY_COUNT"
          if [ "$CURRENCY_COUNT" -eq 0 ]; then
            echo "ERROR: No currencies found."
            exit 1
          fi
          UPDATE_DATE=$(jq -r '.update_date' public/currencies.json)
          if [ -z "$UPDATE_DATE" ] || [ "$UPDATE_DATE" = "null" ]; then
            echo "ERROR: update_date is missing."
            exit 1
          fi
          INVALID_PRICES=$(jq '[.currencies[] | select((.price | type) != "number" or .price <= 0)] | length' public/currencies.json)
          if [ "$INVALID_PRICES" -ne 0 ]; then
            echo "ERROR: Invalid currency prices detected."
            exit 1
          fi
          INVALID_PRICE_CHANGE=$(jq '[.currencies[] | select((.priceChange | type) != "string" or (.priceChange | IN("up", "down", "no_change") | not))] | length' public/currencies.json)
          if [ "$INVALID_PRICE_CHANGE" -ne 0 ]; then
            echo "ERROR: Invalid priceChange values detected."
            exit 1
          fi
          echo "JSON validation successful."
          jq '.' public/currencies.json

      - name: Generate site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp public/currencies.json _site/currencies.json
          if [ -f index.html ]; then
            cp index.html _site/index.html
          else
            echo "ERROR: index.html not found."
            exit 1
          fi
          ls -lah _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
